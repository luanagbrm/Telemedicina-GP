[project]
name = "telemed-plus"
version = "0.1.0"
description = "TeleMed+ — Prontuário eletrônico simplificado com chatbot WhatsApp (IA open source)"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
